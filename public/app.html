<!-- SCREEN 6: VICTORY & AFFIRMATION (FLIP SIDE) -->
    <div id="screen-victory" class="screen">
      <div style="margin: auto 0; width: 100%;">
        <div id="victory-header-badge" class="victory-crown">🏆</div>
        <h2 id="victory-title-text" class="title-large" style="color: var(--success-color); margin-bottom: 12px; font-size: 24px;">Impact Calibrated.</h2>
        
        <!-- Biological / Psychological Affirmation -->
        <div style="background: #FAF7F2; border: 1px solid #EAE3D9; border-radius: 18px; padding: 18px 16px; margin-top: 8px; text-align: left;">
          <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--premium-color); letter-spacing: 0.5px; margin-bottom: 6px;">🧠 Neurological Insight</div>
          <p class="body-text" style="font-size: 14px; line-height: 1.5; color: var(--text-color); margin: 0;" id="victory-validation-copy"></p>
        </div>
      </div>
      
      <!-- Standard Deck Buttons -->
      <div id="standard-victory-actions" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        <button class="btn-primary" style="background-color: var(--success-color);" onclick="claimRewardStack()">Claim Stack</button>
        <button class="btn-bypass" style="width: 100%; padding: 14px; border: 2px solid #EAE3D9; border-radius: 14px; font-size: 14px; font-weight: 700; color: var(--text-color); background: #FAF7F2; cursor: pointer;" onclick="runAnotherRound()">Not enough? Run another round</button>
      </div>

      <!-- Overwhelm Deck Specific Actions -->
      <div id="overwhelm-victory-actions" style="width: 100%; display: none; flex-direction: column; gap: 8px;">
        <button id="btn-overwhelm-next" class="btn-primary" style="background-color: var(--success-color);" onclick="advanceOverwhelmNextMove()">Next move</button>
        <button id="btn-overwhelm-reset" class="btn-primary" style="background-color: #2D2B2A; display: none;" onclick="showInitiationCompleteScreen()">Complete reset</button>
      </div>
    </div>

    <!-- SCREEN 7: INITIATION COMPLETE (OVERWHELM FINAL SCREEN) -->
    <div id="screen-initiation-complete" class="screen">
      <div style="margin: auto 0; width: 100%; text-align: center;">
        <div style="font-size: 48px; color: var(--success-color); margin-bottom: 14px;">✓</div>
        
        <h2 style="font-size: 22px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-color); margin-bottom: 12px;">
          INITIATION COMPLETE
        </h2>
        
        <p style="font-size: 15px; font-weight: 600; color: #6E6A67; margin-bottom: 24px;">
          The freeze is broken. You are in motion.
        </p>

        <div style="background: #FFFFFF; border: 1px solid #EAE3D9; border-radius: 18px; padding: 20px 16px; text-align: left; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.03);">
          <div style="font-size: 11px; font-weight: 800; color: #8A735D; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;">
            YOUR ONLY DIRECTIVE:
          </div>
          <p style="font-size: 15px; font-weight: 700; color: var(--text-color); margin: 0 0 6px 0; line-height: 1.4;">
            Do not switch tasks.
          </p>
          <p style="font-size: 14px; font-weight: 600; color: var(--text-color); margin: 0 0 14px 0; line-height: 1.4;">
            Stay on this single surface for 10 minutes.
          </p>
          <p style="font-size: 13px; color: #6E6A67; margin: 0; line-height: 1.5;">
            You do not need to finish the whole project.<br>
            You only need to make move number two.
          </p>
        </div>
      </div>

      <div style="width: 100%;">
        <button class="btn-primary" style="background-color: var(--success-color); width: 100%;" onclick="claimRewardStack()">
          CLAIM STACK
        </button>
      </div>
    </div>
