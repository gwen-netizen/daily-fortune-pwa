<!-- SCREEN 4: TRIGGER SCREEN (SCREENSHOT 1) -->
    <div id="screen-trigger" class="screen">
      <!-- TOP: ACTIVE DECK HEADING -->
      <div style="margin-top: 10px; width: 100%; text-align: center;">
        <h2 class="title-deck" id="active-deck-title" style="font-size: 24px; font-weight: 800; line-height: 1.25;">Command the room.</h2>
      </div>

      <!-- MIDDLE: START BUTTON & PROMINENT BACK BUTTON DIRECTLY BELOW -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: auto 0;">
        <div class="spin-outer-ring" style="margin: 0 auto 14px auto;">
          <button class="big-red-btn" onclick="executeTurnaroundSpin()">START</button>
        </div>

        <!-- ENLARGED "CHANGE FOCUS AREA" BUTTON BELOW START BUTTON -->
        <button id="btn-change-focus" class="btn-back-focus" onclick="switchScreen('screen-dashboard')">
          <span style="font-size: 16px;">&larr;</span> Change Focus Area
        </button>
      </div>

      <!-- BOTTOM: SLIDE-UP NOTIFICATION (NICELY FITS 2 LINES WITHOUT OBSTRUCTING) -->
      <div id="trigger-slideup-notification" class="slideup-notification-card">
        <div class="notification-line-1" id="trigger-instructions">Take one slow breath before pushing.</div>
        <div class="notification-line-2">Commit to the next 120 seconds completely.</div>
      </div>
    </div>

    <!-- SCREEN 5: COUNTDOWN SCREEN (SCREENSHOT 2) -->
    <div id="screen-countdown" class="screen">
      <div style="width: 100%; margin: auto 0;">
        
        <!-- TASK CARD: TASK TEXT ON TOP, FOCUS AREA BELOW WITH BALANCED SPACING -->
        <div class="task-display-card">
          <div id="target-task-text" class="task-headline-text">Loading calibrated task...</div>
          <div id="target-task-focus-area" class="focus-area-badge">FOCUS AREA: CORE BIOMECHANICS</div>
        </div>

        <!-- TIMING DISPLAY (LOCKED AT 02:00 BEFORE TICKING) -->
        <div class="timer-large" id="timer-display" style="margin: 22px 0 6px 0;">02:00</div>
        
        <!-- POLISHED DIRECTIVE COPY -->
        <p class="body-text" style="font-size: 13px; font-weight: 600; color: #7A7571;">Do not multitask. Follow through to see the results.</p>
      </div>

      <div style="width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
        <button class="btn-primary" onclick="finishEarly()">I Completed The Move Early &rarr;</button>
        <button class="btn-bypass" onclick="cancelTimer()">Abort Protocol</button>
      </div>
    </div>
