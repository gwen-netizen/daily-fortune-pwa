<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Advice App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      color: #111827;
      font-size: 1.5rem;
    }

    p {
      color: #4b5563;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    button {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #4338ca;
    }

    button.secondary {
      background-color: #e5e7eb;
      color: #1f2937;
    }

    button.secondary:hover {
      background-color: #d1d5db;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- SCREEN 0: PAYWALL -->
  <div id="screen-paywall" class="screen">
    <h2>Unlock Daily Advice</h2>
    <p>Subscribe to get full access to your personalized daily fortunes and push notifications.</p>
    <button onclick="goToStripeCheckout()">Subscribe Now</button>
  </div>

  <!-- SCREEN LOADING -->
  <div id="screen-loading" class="screen">
    <div class="spinner"></div>
    <p>Verifying subscription status...</p>
  </div>

  <!-- SCREEN 1: ONBOARDING -->
  <div id="screen-onboarding" class="screen">
    <h2>Welcome aboard! ✨</h2>
    <p>Enable push notifications so you never miss your daily fortune delivery.</p>
    <button id="btn-enable-push" onclick="enableNotificationsAndSave()">Enable Notifications & Complete Setup</button>
  </div>

  <!-- SCREEN DASHBOARD -->
  <div id="screen-dashboard" class="screen">
    <h2>Your Daily Advice 🔮</h2>
    <p id="user-display">Loading profile...</p>
    <button class="secondary" onclick="logout()">Log Out</button>
  </div>

  <script>
    const CONFIG = {
      VERIFY_ENDPOINT: 'https://n8n-latest-x9ac.onrender.com/webhook/verify-subscriber',
      SAVE_PUSH_ENDPOINT: 'https://n8n-latest-x9ac.onrender.com/webhook/save-push-subscription',
      VAPID_PUBLIC_KEY: 'YOUR_PUBLIC_VAPID_KEY_HERE', // Replace with your VAPID Public Key
      STRIPE_CHECKOUT_URL: 'https://buy.stripe.com/3cI8wPcjsbP29yWeQm0co01',
      INITIAL_AUDIT_DELAY_MS: 15000, 
      MAX_AUDIT_RETRIES: 3,          
      RETRY_INTERVAL_MS: 5000        
    };

    // Helper: Convert VAPID key string to Uint8Array for pushManager
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Switch visible screen
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('active');
      }

      if (screenId === 'screen-dashboard') {
        const email = localStorage.getItem('userEmail') || 'Subscriber';
        document.getElementById('user-display').innerText = `Logged in as: ${email}`;
      }
    }

    // Route user to Screen 1 or Dashboard
    function routeUserToApp() {
      const onboardingDone = localStorage.getItem('onboardingComplete');
      if (onboardingDone === 'true') {
        showScreen('screen-dashboard');
      } else {
        showScreen('screen-onboarding'); // Screen 1
      }
    }

    // Asynchronous background audit (security + grace period)
    async function runBackgroundAudit(email) {
      for (let attempt = 1; attempt <= CONFIG.MAX_AUDIT_RETRIES; attempt++) {
        try {
          const res = await fetch(`${CONFIG.VERIFY_ENDPOINT}?email=${encodeURIComponent(email)}`);

          // Fail-open on server error to protect valid users
          if (!res.ok) return;

          const data = await res.json();

          if (data.isSubscribed || data.status === 'Active') {
            localStorage.setItem('isVerified', 'true');
            return;
          }
        } catch (err) {
          // Fail-open on network drop
          return;
        }

        if (attempt < CONFIG.MAX_AUDIT_RETRIES) {
          await new Promise(r => setTimeout(r, CONFIG.RETRY_INTERVAL_MS));
        }
      }

      // Check 24h grace period before eviction
      const subscribedAt = parseInt(localStorage.getItem('subscribedAt') || '0', 10);
      const hoursSinceSub = (Date.now() - subscribedAt) / (1000 * 60 * 60);

      if (subscribedAt > 0 && hoursSinceSub <= 24) return;

      // Evict backdoor intruder or canceled subscription
      localStorage.clear();
      showScreen('screen-paywall');
    }

    // App Startup Logic
    async function verifyUserOnStartup() {
      const urlParams = new URLSearchParams(window.location.search);
      const emailFromUrl = urlParams.get('email');
      const storedEmail = localStorage.getItem('userEmail');
      const isVerified = localStorage.getItem('isVerified');

      // 1. STRIPE REDIRECT (?email= present): Force Screen 1 directly
      if (emailFromUrl) {
        localStorage.setItem('userEmail', emailFromUrl);
        localStorage.setItem('isSubscribed', 'true');
        localStorage.setItem('subscribedAt', Date.now().toString());
        localStorage.removeItem('isVerified');

        // Clean address bar without reload
        window.history.replaceState({}, document.title, window.location.pathname);

        // Load Screen 1 immediately
        routeUserToApp();

        // Schedule background audit
        setTimeout(() => runBackgroundAudit(emailFromUrl), CONFIG.INITIAL_AUDIT_DELAY_MS);
        return;
      }

      // 2. FULLY VERIFIED RETURNING USER
      if (storedEmail && isVerified === 'true') {
        routeUserToApp();
        return;
      }

      // 3. RETURNING USER WITH LOCAL IDENTIFIER
      if (storedEmail) {
        routeUserToApp();
        runBackgroundAudit(storedEmail);
        return;
      }

      // 4. NO IDENTITY -> SHOW SCREEN 0 (PAYWALL)
      showScreen('screen-paywall');
    }

    // Screen 1: Capture Web Push Keys and post to n8n for Column F & G
    async function enableNotificationsAndSave() {
      const email = localStorage.getItem('userEmail');
      const btn = document.getElementById('btn-enable-push');
      if (btn) btn.innerText = "Saving preferences...";

      if (email && 'serviceWorker' in navigator && 'PushManager' in window) {
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY)
            });

            await fetch(CONFIG.SAVE_PUSH_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: email,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                pushSubscription: JSON.stringify(sub)
              })
            });
          }
        } catch (err) {
          console.error('Push registration error:', err);
        }
      }

      completeOnboarding();
    }

    // Navigation Actions
    function goToStripeCheckout() {
      window.location.href = CONFIG.STRIPE_CHECKOUT_URL;
    }

    function completeOnboarding() {
      localStorage.setItem('onboardingComplete', 'true');
      showScreen('screen-dashboard');
    }

    function logout() {
      localStorage.clear();
      showScreen('screen-paywall');
    }

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
      verifyUserOnStartup();
    });
  </script>
</body>
</html>
