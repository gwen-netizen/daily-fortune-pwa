<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2 Min Turnaround</title>
  
  <meta name="theme-color" content="#FAF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Web App Manifest for PWA Installation -->
  <link rel="manifest" href="manifest.json">

  <!-- Confetti Utility Library for the Dopamine Reward Phase -->
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --bg-color: #FAF7F2;
      --text-color: #2D2B2A;
      --card-bg: #FFFFFF;
      --accent-color: #D4A373;
      --premium-color: #8A735D;
      --success-color: #4A7C59;
      --timer-color: #E07A5F;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      overflow: hidden; 
      touch-action: manipulation;
      user-select: none; 
      -webkit-user-select: none;
    }

    .app-container {
      width: 100%; 
      max-width: 420px; 
      height: 94vh; 
      padding: 16px; 
      position: relative;
    }

    .screen {
      background-color: var(--card-bg); 
      border-radius: 32px; 
      padding: 36px 24px; 
      text-align: center;
      box-shadow: 0 24px 60px rgba(45, 43, 42, 0.05); 
      width: calc(100% - 32px); 
      height: calc(100% - 32px); 
      position: absolute; 
      top: 16px; 
      left: 16px; 
      opacity: 0; 
      visibility: hidden; 
      transform: translateY(20px); 
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      overflow-y: auto;
    }

    .screen.active { 
      opacity: 1; 
      visibility: visible; 
      transform: translateY(0); 
      z-index: 10; 
    }

    .title-large { 
      font-weight: 800; 
      font-size: 32px; 
      line-height: 1.15; 
      color: var(--text-color); 
      letter-spacing: -0.5px; 
    }

    .title-deck { 
      font-weight: 800; 
      font-size: 24px; 
      color: var(--accent-color); 
      letter-spacing: -0.3px; 
    }

    .body-text { 
      font-size: 15px; 
      line-height: 1.5; 
      color: #6E6A67; 
      margin-top: 8px; 
    }

    .italic-hint { 
      font-size: 13px; 
      color: #9C8E80; 
      font-style: italic; 
      line-height: 1.4; 
    }

    .metric-ribbon {
      display: flex; 
      width: 100%; 
      background: #FAF7F2; 
      border-radius: 20px; 
      padding: 14px; 
      gap: 10px; 
      margin-bottom: 8px;
    }

    .metric-block { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
    }

    .metric-num { 
      font-size: 22px; 
      font-weight: 800; 
      color: var(--text-color); 
    }

    .metric-lbl { 
      font-size: 11px; 
      font-weight: 700; 
      color: #9C8E80; 
      text-transform: uppercase; 
      letter-spacing: 0.3px; 
      margin-top: 2px; 
    }

    .onboarding-options { 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-top: 24px; 
    }

    .option-card {
      background: #FAF7F2; 
      border: 2px solid #FAF7F2; 
      border-radius: 20px; 
      padding: 18px; 
      text-align: left; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .option-card.selected { 
      border-color: var(--accent-color); 
      background: #FFFFFF; 
      box-shadow: 0 8px 24px rgba(212, 163, 115, 0.1); 
    }

    .option-title { 
      font-weight: 800; 
      font-size: 16px; 
      color: var(--text-color); 
    }

    .option-desc { 
      font-size: 13px; 
      color: #7A7571; 
      line-height: 1.4; 
      margin-top: 4px; 
    }

    .deck-list { 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }

    .deck-item {
      background: #FAF7F2; 
      border: 2px solid transparent; 
      border-radius: 20px; 
      padding: 16px; 
      text-align: left; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .deck-item.selected { 
      border-color: var(--accent-color); 
      background: #FFFFFF; 
      box-shadow: 0 8px 24px rgba(45, 43, 42, 0.03); 
    }

    .deck-meta { 
      font-weight: 800; 
      font-size: 10px; 
      letter-spacing: 0.8px; 
      margin-bottom: 2px; 
    }

    .deck-meta.free { color: var(--success-color); }
    .deck-meta.premium { color: var(--premium-color); }
    .deck-name { font-weight: 800; font-size: 16px; color: var(--text-color); }
    .deck-desc { font-size: 13px; color: #7A7571; margin-top: 3px; line-height: 1.4; }

    .btn-primary {
      width: 100%; 
      padding: 18px; 
      border: none; 
      border-radius: 20px; 
      font-size: 16px; 
      font-weight: 700;
      cursor: pointer; 
      background-color: var(--text-color); 
      color: #FFFFFF; 
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-primary:active { 
      transform: scale(0.98); 
      opacity: 0.9; 
}

    .btn-success-action { 
      background-color: var(--success-color) !important; 
      box-shadow: 0 8px 24px rgba(74, 124, 89, 0.2);
      margin-bottom: 4px; 
    }

    .spin-outer-ring {
      width: 220px; 
      height: 220px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      background: rgba(255, 107, 91, 0.05); 
      margin: auto; 
      animation: radialPulse 2.5s infinite ease-in-out;
    }

    .big-red-btn {
      background: linear-gradient(135deg, #FF6B5B 0%, #D94E3D 100%); 
      border: none; 
      width: 180px; 
      height: 180px; 
      border-radius: 50%;
      cursor: pointer; 
      box-shadow: 0 20px 45px rgba(217, 78, 61, 0.25), inset 0 4px 12px rgba(255, 255, 255, 0.3);
      font-size: 24px; 
      font-weight: 900; 
      color: #FFFFFF; 
      letter-spacing: 0.5px; 
      transition: transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .big-red-btn:active { transform: scale(0.92); }

    .timer-ring { 
      font-size: 56px; 
      font-weight: 800; 
      color: var(--timer-color); 
      margin: 12px 0; 
      font-family: -apple-system-font, monospace; 
      letter-spacing: -1px; 
    }

    .task-display-card {
      background: #FAF7F2; 
      border: 2px dashed #EAE3D9; 
      padding: 28px 24px; 
      border-radius: 24px; 
      width: 100%; 
      margin: auto 0;
    }

    .task-display-text { 
      font-size: 18px; 
      font-weight: 700; 
      line-height: 1.5; 
      color: var(--text-color); 
      letter-spacing: -0.2px; 
    }

    .victory-crown { 
      font-size: 64px; 
      margin-bottom: 8px; 
      animation: scaleEntrance 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    .paywall-modal {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: #FAF7F2; 
      z-index: 100;
      border-radius: 32px; 
      padding: 36px 24px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      opacity: 0; 
      visibility: hidden; 
      transform: scale(0.95); 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .paywall-modal.active { opacity: 1; visibility: visible; transform: scale(1); }

    .paywall-features { 
      text-align: left; 
      width: 100%; 
      margin: 20px 0; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }

    .feature-item { 
      font-size: 14px; 
      font-weight: 500; 
      display: flex; 
      align-items: flex-start; 
      gap: 12px; 
      line-height: 1.4; 
      color: #555250; 
    }

    .feature-item span { font-size: 18px; line-height: 1; }

    .tier-box {
      border: 2px solid #EAE3D9; 
      border-radius: 20px; 
      padding: 18px; 
      width: 100%; 
      text-align: left; 
      margin-bottom: 12px; 
      cursor: pointer; 
      background: #FFFFFF; 
      transition: border-color 0.2s;
    }

    .tier-box.selected { 
      border-color: var(--premium-color); 
      box-shadow: 0 8px 24px rgba(138, 115, 93, 0.08); 
    }

    .btn-bypass { 
      font-size: 14px; 
      font-weight: 600; 
      color: #A8A29E; 
      background: none; 
      border: none; 
      cursor: pointer; 
      text-decoration: none; 
      margin-top: 8px; 
      transition: color 0.2s; 
    }

    .btn-bypass:hover { color: var(--text-color); }

    .btn-text-nav {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .btn-text-nav:active { background: rgba(212, 163, 115, 0.08); }

    .install-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFBF7;
      border: 1px solid #EAE3D9;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      animation: scaleEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-small-install {
      background: var(--text-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-small-install:active { opacity: 0.85; }
